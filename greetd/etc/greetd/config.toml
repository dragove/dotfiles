# Login/greeter config, versioned in ~/dotfiles (package: greetd).
# Restore on a new machine (after installing greetd + noctalia-greeter-git):
#   cd ~/dotfiles && sudo stow -t / greetd
#   sudo systemctl enable --now greetd
# See man greetd.5

[terminal]
vt = 1

[default_session]
# Noctalia greeter. Shown whenever no session is running, e.g. after logout.
# `-- --session niri` makes the greeter UI itself run on niri.
command = "/usr/bin/noctalia-greeter-session -- --session niri"
user = "greeter"

[initial_session]
# Autologin: boot straight into niri as dove, no greeter.
# Runs exactly once per boot (greetd runfile /run/greetd.run); after logout the
# greeter above appears. Delete /run/greetd.run to force it again without reboot.
# -l: greetd already sourced /etc/profile + ~/.profile (source_profile = true),
# so tell niri-session not to re-exec a login shell.
command = "niri-session -l"
user = "dove"

# Quick access terminal (Quake/Yakuake style) — see: kitten quick-access-terminal
# NOTE: only full-line comments are supported; inline comments corrupt values.

# Top-edge docking, full width inset by the same margins as the noctalia bar
# pill (measured ~101px on a 1920px output, so panel width == bar width),
# flush at the top: noctalia's reserved bar space pushes the panel below it.
edge top
lines 540px
margin_top 0
margin_left 101
margin_right 101

layer top
background_opacity 0.85

hide_on_focus_loss no
focus_policy exclusive

# Always on the primary monitor (only honored at creation time)
output_name HDMI-A-1
